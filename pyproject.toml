[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-content-factory-portfolio"
version = "0.1.0"
description = "Telegram-first, human-in-the-loop AI content and video orchestration platform"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "AI Content Factory contributors"}]
keywords = ["llm", "ai-agents", "telegram", "video-generation", "comfyui", "ltx-video"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = []

[project.urls]
Repository = "https://github.com/damirmirgalimov4-lang/ai-content-factory-portfolio"
Documentation = "https://github.com/damirmirgalimov4-lang/ai-content-factory-portfolio/tree/main/docs"

[project.scripts]
content-factory = "agent_platform.telegram_bot:main"
partner-assistant = "agent_platform.partner_bot:main"
ltx-worker = "ltx_worker.__main__:main"

[tool.setuptools]
packages = ["agent_platform", "ltx_worker"]

[tool.setuptools.package-data]
agent_platform = ["prompt_templates/*.txt", "prompt_templates/*.json"]
ltx_worker = ["assets/*.json", "assets/*.lock", "assets/*LICENSE"]
